[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiml-calc"
version = "0.3.0"
description = "Classic AI and machine-learning algorithms implemented from scratch, worked step by step, with runnable Python code for each, a web UI and an MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Danny Penrose" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]
keywords = ["aima", "artificial-intelligence", "machine-learning", "search", "a-star", "dpll", "csp",
            "alpha-beta", "bayesian-network", "k-means", "mcp", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50", "altair>=5", "pandas>=2", "streamlit-ace>=0.1.1"]
dev = ["pytest>=8", "streamlit>=1.50", "altair>=5", "pandas>=2", "streamlit-ace>=0.1.1"]

[project.scripts]
aiml-calc = "aiml_calc.server:main"
aiml-calc-ui = "aiml_calc.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiml_calc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
