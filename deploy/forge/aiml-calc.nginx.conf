# aiml.dannypenrose.com: the aiml-calc Streamlit UI.
# Installed by deploy/forge-setup.sh as /etc/nginx/sites-available/aiml-calc (linked from
# sites-enabled). Plain HTTP: TLS ends at Cloudflare and the home-public tunnel delivers here.
# Visitors' real addresses come from /etc/nginx/conf.d/cloudflare-real-ip.conf.

# Streamlit keeps one WebSocket per open tab and re-runs Python on every interaction, so cap
# each address: a generous page-load rate and a handful of concurrent connections.
limit_req_zone  $binary_remote_addr zone=aimlcalc_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=aimlcalc_conn:10m;

map $http_upgrade $aimlcalc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiml.dannypenrose.com;

    access_log /var/log/nginx/aiml-calc.access.log;
    error_log  /var/log/nginx/aiml-calc.error.log warn;

    client_max_body_size 1m;

    # Only dannypenrose.com may frame the app (its /aiml-calc page embeds it in the site layout).
    add_header Content-Security-Policy "frame-ancestors 'self' https://dannypenrose.com https://www.dannypenrose.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3090/_stcore/health;
    }

    location / {
        limit_req  zone=aimlcalc_req burst=60 nodelay;
        limit_conn aimlcalc_conn 20;

        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aimlcalc_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
